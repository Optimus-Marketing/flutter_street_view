name: flutter_google_street_view
description: A flutter plugin of google street view in iOS and Android applications.
repository: https://github.com/Optimus-Marketing/flutter_street_view
version: 3.2.0

environment:
  sdk: ^3.9.0
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.30

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: zyz.flutter.plugin.flutter_google_street_view
        pluginClass: FlutterGoogleStreetViewPlugin
      ios:
        pluginClass: FlutterGoogleStreetViewPlugin
